<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Fotos</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="styleGalery.css">
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="header">
        <div class="container">
            <h1 class="header-title">
                <i class="bi bi-images"></i>
                Galería de Fotos
            </h1>
            <p class="header-subtitle">Explora nuestra colección de imágenes</p>
        </div>
    </header>


    <!-- ========== CONTROLES ========== -->
    <section class="controles">
        <div class="container">
            <div class="controles-wrapper">
                
                <!-- Barra de búsqueda -->
                <div class="search-box">
                    <!-- <i class="bi bi-search search-icon"></i>
                    <input 
                        type="text" 
                        class="form-control search-input" 
                        id="search-input"
                        placeholder="Buscar fotos..."
                    > -->
                </div>

                <!-- Botones de acción -->
                <div class="action-buttons">
                    <button class="btn btn-outline-primary" id="cargar-mas-btn">
                        <i class="bi bi-plus-circle"></i>
                        Cargar más
                    </button>
                    <button class="btn btn-outline-secondary" id="limpiar-btn">
                        <i class="bi bi-arrow-clockwise"></i>
                        Limpiar
                    </button>
                </div>

            </div>
        </div>
    </section>


    <!-- ========== GALERÍA ========== -->
    <section class="galeria-section">
        <div class="container">
            
            <!-- Contador de fotos -->
            <div class="info-bar">
                <p class="fotos-count">
                    <i class="bi bi-collection"></i>
                    <span id="fotos-count">0</span> fotos
                </p>
            </div>

            <!-- Grid de fotos -->
            <div class="galeria-grid" id="galeria">
                
                <!-- Las fotos se cargarán aquí dinámicamente -->
                <!-- Ejemplo de estructura de una foto: -->
                
                <!-- 
                <div class="foto-card">
                    <img src="..." alt="Foto" class="foto-img">
                    <div class="foto-info">
                        <h5 class="foto-titulo">Título de la foto</h5>
                        <p class="foto-id">#123</p>
                    </div>
                </div>
                -->

            </div>

            <!-- Mensaje cuando no hay fotos -->
            <div class="mensaje-vacio d-none" id="mensaje-vacio">
                <i class="bi bi-inbox"></i>
                <p>No hay fotos para mostrar</p>
            </div>

            <!-- Loader -->
            <div class="loader d-none" id="loader">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
                <p>Cargando fotos...</p>
            </div>

        </div>
    </section>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="galery.js"></script>
</body>
</html>
